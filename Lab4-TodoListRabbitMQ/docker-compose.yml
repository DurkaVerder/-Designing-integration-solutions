services:

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      JWT_SECRET: "development-secret"
      CORS_ALLOWED_ORIGINS: "http://localhost:8081,http://localhost:8082"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      RABBITMQ_API_KEY: "development-api-key"
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy

  swagger:
    image: swaggerapi/swagger-ui:v5.18.2
    depends_on:
      - api
    environment:
      SWAGGER_JSON: /openapi.yaml
      URL: /openapi.yaml
    volumes:
      - ./docs/openapi.yaml:/openapi.yaml:ro
    ports:
      - "8082:8080"
